---
- name: Make sure the group exists
  ansible.builtin.group:
    name: "{{ group }}"
    state: present

- name: Creating non-existing user
  ansible.builtin.user:
    name: "{{ user }}"
    group: "{{ group }}"
    comment: "Bamboo agent"
    state: present
    createhome: true
  ignore_errors: true # might fail if LDAP
  register: user_output

- name: Fix home permissions
  when: user_output.failed is false
  ansible.builtin.file:
    path: "{{ user_output.home }}"
    state: directory
    owner: "{{ user }}"
    mode: "0755"
