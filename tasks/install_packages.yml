# Installs the necessary packages on the target host

- name: Install Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker Repository
  ansible.builtin.apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Install Docker packages on the host
  ansible.builtin.apt:
    name: "{{ item }}"
    update_cache: true
    state: present
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    - gnupg2 # see https://stackoverflow.com/questions/51657060/error-saving-credentials-in-docker-login
    - pass

- name: Install additional packages on the host
  ansible.builtin.apt:
    name: "{{ item }}"
    update_cache: true
    state: present
    cache_valid_time: 3600
  loop: "{{ packages_to_install + host_specific_packages_to_install }}"

- name: Read agent capability file
  ansible.builtin.include_tasks: read_capability.yml

- name: Check if binary exists in PATH
  ansible.builtin.command:
    cmd: which {{ item }}
  loop: "{{ command_capabilities_to_declare + host_specific_command_capabilities_to_declare }}"
  register: which_out
  ignore_errors: true
  changed_when: true

- name: Declare new capabilities
  ansible.builtin.set_fact:
    capabilities: "{{ (capabilities | default({})) | combine({'system.builder.command.' + item.item: item.stdout_lines[0]}) }}"
  loop: "{{ which_out.results }}"

- name: Update agent capability file
  ansible.builtin.include_tasks: write_capability.yml
