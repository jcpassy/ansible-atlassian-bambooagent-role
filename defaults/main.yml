---
# Agent
service_name: bambooagent
user: bambooagent
group: bambooagent_grp
install_root: "/home/{{ user }}"
agent_root: "{{ install_root }}/bamboo-agent-home"

# Location of the capabilities file on the remote
capability_file: "{{ agent_root }}/bin/bamboo-capabilities.properties"

# Additional options passed to Java
java_additional_options:
  - "-Djava.awt.headless=true"
  - "-Dbamboo.home={{ agent_root }}"

# Python3 versions to install
python3_versions:
  - 3
  - 3.8


# Additional environment variables set before running the bamboo agent (eg. CUDA_VISIBLE_DEVICES)
additional_environment: []

# Default capability of the agent
capabilities: {}

# Bamboo remote agent security token
security_token: ""

# Indicates that fetching from server should verify the certificates
verify_certificates: true

# Packages to install via apt
packages_to_install: []
