- name: Register init.d
  ansible.builtin.command: update-rc.d {{ bambooagent_service_name }} enabled
  register: output
  changed_when: output.rc != 0

- name: Register bambooagent service
  ansible.builtin.service:
    name: "{{ bambooagent_service_name }}"
    state: reloaded
    enabled: true

- name: Restart bambooagent linux/macOS
  ansible.builtin.service:
    name: "{{ bambooagent_service_name }}"
    state: restarted
    enabled: true
  listen: "Restart bambooagent"
  when:
    - ansible_distribution != "Windows"

- name: Restart bambooagent windows
  ansible.windows.win_service:
    name: "{{ bambooagent_service_name }}"
    state: restarted
  listen: "Restart bambooagent"
  when:
    - ansible_os_family == "Windows"
